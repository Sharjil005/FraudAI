# FraudShield AI — static bundle + API reverse proxy.
#
# The React app calls a relative `/api` base URL, so proxying here means the
# browser never makes a cross-origin request and CORS is a non-issue in Docker.

upstream fraudshield_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Document uploads are capped at 10 MB by the API; let them reach it so the
    # user sees the API's friendly error instead of an nginx 413 page.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://fraudshield_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Model warm-up and OCR can take a while on the first request.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Interactive API docs, served through the same origin for convenience.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://fraudshield_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # BrowserRouter deep links (/dashboard/scans/12) must resolve to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
